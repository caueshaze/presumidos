services:
  ferrugem-web:
    image: presumidos/ferrugem-web:local-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      APP_ENV: production
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      DATABASE_PATH: /data/bolao.db
      COOKIE_SECURE: "true"
      REQUIRE_TRUSTED_PROXY: "true"
      TRUSTED_PROXY_CIDRS: 172.31.0.10/32
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379
      IP: 0.0.0.0
      PORT: "8080"
      STATIC_DIR: /app/public
      PRESUMIDOS_ASSET_DIR: /data/assets
      PRESUMIDOS_BACKUP_DIR: /backups
      PRESUMIDOS_MIN_FREE_BYTES: "104857600"
      PRESUMIDOS_DATABASE_BUSY_TIMEOUT_MS: "5000"
      PRESUMIDOS_MAX_BODY_BYTES: "134217728"
      SHUTDOWN_TIMEOUT_SECS: "30"
      PRESUMIDOS_JSON_LOGS: "true"
      PRESUMIDOS_METRICS_ENABLED: "false"
    expose:
      - "8080"
    volumes:
      - app_data:/data
      - ./backups:/backups:Z
    networks:
      origin:
        ipv4_address: 172.31.0.20
      egress: {}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      origin:
        ipv4_address: 172.31.0.30

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - ferrugem-web
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/maintenance:/srv/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      public:
      origin:
        ipv4_address: 172.31.0.10

networks:
  public:

  egress:

  origin:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  app_data:
  caddy_data:
  caddy_config:
  redis_data:
